name: Pages

# Builds the SPA and publishes dist/ to GitHub Pages.
#
# Pages serves static files only: it cannot set Cross-Origin-Opener-Policy /
# Cross-Origin-Embedder-Policy, so the page is not cross-origin isolated and the
# single-threaded worker pool is used instead of the shared-memory build. The
# output is identical; only parallelism differs. The Cloudflare Worker
# (wrangler.jsonc) is what enables the threaded build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
